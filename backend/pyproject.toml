[project]
name = "shimavault-backend"
version = "0.1.0"
description = "ShimaVault API — Twitch VOD, clip, and chat platform backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
# Kept ahead of requires-python (3.11): numpy's stubs (pulled in
# transitively via chromadb) use PEP 695 syntax that mypy's parser gates on
# this setting even for stub-only files. This only affects how mypy reads
# annotations, not the actual runtime target.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
